<!DOCTYPE html>

    <title>Secret Forum</title>

    <head>
        <ul style="color: black">

            <h1>A Forum!</h1>

        </ul>

        <style>

            .b{

                color: blue;

            }

            .c{

                color: green;

            }

            .a{

                text-align: center;

            }

            body{

                background-color: grey;

            }

            input{

                border-radius: 10px;
                padding: 2px;

            }

            a{

                color:black;
                border-radius: 10px;
                text-decoration:none;
                background-color: blue;
                padding:10px;

            }

        </style>

    </head>

    <body>

        <form action="Thank_you.html">

            <label>Name</label>
            <input minlength="1" maxlength="32" required type="text">
            <br>
            <label>Age</label>
            <input max="85" min="0" required type="number">
            <br>
            <label>Hobby</label>
            <input required type="text">
            <br>
            <label>Birthday</label>
            <input required type="date">
            <br>
            <label>School Time</label>
            <input required type="time">
            <br>
            <label>Submission Time</label>
            <input required type="datetime-local">
            <br>
            <label>Email</label>
            <input required type="email">
            <br>
            <label>Password</label>
            <input minlength="3" maxlength="20" required type="password">
            <br>
            <label>Rating</label>
            <input required type="range">
            <br>
            <label>Color</label>
            <input required type="color">
            <br>
            <label>Search</label>
            <input required type="search">
            <br>
            <label>Month</label>
            <input required type="week">
            <br>
            <br>
            <button>Submit!</button>

        </form>
        <br>
        <li class="b">The above is an input box!</li>
        <br>
        <br>
        <a href="index.html"><--Go back--></a>

    </body>

</html>
